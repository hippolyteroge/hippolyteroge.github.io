<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable · Hippolyte Rogé</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/styles.css?v=17">
<script>
(function () {
  try {
    var saved = localStorage.getItem('lang');
    var lang = saved || ((navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'fr');
    document.documentElement.setAttribute('data-lang', lang);
    document.documentElement.lang = lang;
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="glow-field"></div>
<main class="notfound">
  <h1 data-lang="fr">Page introuvable</h1>
  <h1 data-lang="en">Page not found</h1>
  <p data-lang="fr">Cette page n'existe pas ou a été déplacée.</p>
  <p data-lang="en">This page doesn't exist or has been moved.</p>
  <a href="/" class="btn btn-primary"><span data-lang="fr">Retour à l'accueil</span><span data-lang="en">Back to home</span></a>
</main>
</body>
</html>
